name: CMake for macOS Universal

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Configure brew
        run: |
          brew update
          brew install nasm

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build ARM64
        run: |
          cmake -B build-arm64 \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DCMAKE_OSX_ARCHITECTURES=arm64

          cmake --build build-arm64 \
            --config ${{env.BUILD_TYPE}}

      - name: Build x86_64
        run: |
          cmake -B build-x86_64 \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DCMAKE_OSX_ARCHITECTURES=x86_64

          cmake --build build-x86_64 \
            --config ${{env.BUILD_TYPE}}

      - name: Create Universal Binary
        run: |
          mkdir build
          lipo -create \
            build-arm64/translucent-sdl3.app/Contents/MacOS/translucent-sdl3 \
            build-x86_64/translucent-sdl3.app/Contents/MacOS/translucent-sdl3 \
            -output build/translucent-sdl3-macos-universal
          chmod +x build/translucent-sdl3-macos-universal

      - name: Verify architectures
        run: |
          lipo -info build/translucent-sdl3-macos-universal

      - name: Zip .app files
        run: |
          zip -r build/translucent-sdl3-arm64.app.zip build-arm64/translucent-sdl3.app
          zip -r build/translucent-sdl3-x86_64.app.zip build-x86_64/translucent-sdl3.app

      - name: Upload Universal
        uses: actions/upload-artifact@v7
        with:
          name: translucent-sdl3-macos-universal
          path: build/translucent-sdl3-macos-universal
          compression-level: 9

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          make_latest: true
          token: ${{secrets.GH_PAT}}
          files: |
            build/translucent-sdl3-macos-universal
            build/translucent-sdl3-arm64.app.zip
            build/translucent-sdl3-x86_64.app.zip